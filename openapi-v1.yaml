# OpenAPI 3.1 description of the Run It on AI /v1 HTTP mirror.
#
# This is the surface a ChatGPT Custom GPT imports as its Actions schema
# (and anything else that speaks plain HTTP instead of MCP). Served live at
# GET https://mcp.runitonai.com/openapi.yaml.
#
# Auth model: the reader's access code — the Gumroad license key from their
# receipt — travels INSIDE tool-call arguments (`access_code`), not in a
# header. That is deliberate: it is the only credential every AI chat client
# can carry, and it identifies a purchase, not a person. No PII required.
openapi: 3.1.0
info:
  title: Run It on AI — companion content API
  version: 0.2.0
  description: |
    HTTP mirror of the Run It on AI MCP server (mcp.runitonai.com).

    Serves the ebook companion's operating instructions and Implementation
    Blocks (both keyless), plus buyer-gated chapter content.

    To access gated content (lookup_chapter), include `access_code` in the
    tool-call `arguments` — the Gumroad license key shown on the buyer's
    receipt (format XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX). Ask the user for
    it once, then pass it on every gated call. Never send the user's email,
    name, or conversation content; no endpoint accepts any of it.

    Recommended flow for a fresh session:
      1. POST /v1/tools/call {"name": "activate", "arguments": {}} and follow
         the returned operating instructions.
      2. Implementation Blocks: get_implementation_block, no access code.
      3. Chapter content: lookup_chapter with the user's access_code.
  contact:
    url: https://runitonai.com
servers:
  - url: https://mcp.runitonai.com
paths:
  /v1/tools/list:
    get:
      operationId: listTools
      summary: List available tools
      description: >
        Returns the tool catalogue: name, description, and JSON-Schema input
        shape for every tool this server exposes. Stubbed (not-yet-shipped)
        tools are listed too and return a structured not_implemented error
        when called.
      responses:
        "200":
          description: Tool catalogue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: array
                    items:
                      $ref: "#/components/schemas/ToolDef"
  /v1/tools/call:
    post:
      operationId: callTool
      summary: Call a tool by name
      description: >
        Invoke one tool. `lookup_chapter` (chapter prose) requires
        `access_code` inside `arguments` — the buyer's Gumroad license key.
        `activate` (operating instructions) and `get_implementation_block`
        (public Implementation Blocks) require no authentication; call
        `activate` first in a fresh session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Tool name from /v1/tools/list.
                  enum:
                    - activate
                    - lookup_chapter
                    - get_implementation_block
                arguments:
                  type: object
                  description: >
                    Tool arguments per the tool's inputSchema. For
                    lookup_chapter, include access_code (the reader's
                    license key).
                  additionalProperties: true
            examples:
              activate:
                summary: Load the companion's operating instructions (no auth)
                value:
                  name: activate
                  arguments: {}
              chapter:
                summary: Fetch a chapter with the reader's access code
                value:
                  name: lookup_chapter
                  arguments:
                    chapter_id: how-ai-actually-works
                    access_code: XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX
              implementation_block:
                summary: Fetch an Implementation Block (no auth needed)
                value:
                  name: get_implementation_block
                  arguments:
                    chapter_id: before-you-build-anything
                    name: pre-automation-discipline
      responses:
        "200":
          description: Tool result payload (shape varies per tool).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: >
            Structured error: unauthorized (bad/missing access_code),
            rate_limited, invalid_input, chapter_not_found, ib_not_found,
            not_implemented (stub tools), or invalid_json.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
components:
  schemas:
    ToolDef:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        inputSchema:
          type: object
          additionalProperties: true
    ErrorResult:
      type: object
      properties:
        error:
          type: string
          description: Machine-readable error code.
      additionalProperties: true
